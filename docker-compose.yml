x-ca-env: &ca-env
  SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
  REQUESTS_CA_BUNDLE: "/etc/ssl/certs/ca-certificates.crt"
  CURL_CA_BUNDLE: "/etc/ssl/certs/ca-certificates.crt"

x-ca-volume: &ca-volume
  "${LOCAL_AI_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/certs/ca-certificates.crt:ro"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama
    restart: unless-stopped
    environment:
      <<: *ca-env
    ports:
      - "${OLLAMA_BIND_HOST:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - *ca-volume
      - ollama-models:/root/.ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ai-open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    expose:
      - "8080"
    environment:
      <<: *ca-env
      OLLAMA_BASE_URL: "http://ollama:11434"
      WEBUI_AUTH: "${WEBUI_AUTH:-true}"
      # ENABLE_PERSISTENT_CONFIG=false faz o Open WebUI honrar estas variaveis
      # mesmo quando ja existe configuracao persistida no volume.
      ENABLE_PERSISTENT_CONFIG: "${ENABLE_PERSISTENT_CONFIG:-true}"
      DEFAULT_MODEL_METADATA: '${DEFAULT_MODEL_METADATA:-{}}'
      ENABLE_WEB_SEARCH: "${ENABLE_WEB_SEARCH:-false}"
      ENABLE_SEARCH_QUERY_GENERATION: "${ENABLE_SEARCH_QUERY_GENERATION:-true}"
      WEB_SEARCH_ENGINE: "${WEB_SEARCH_ENGINE:-searxng}"
      WEB_SEARCH_RESULT_COUNT: "${WEB_SEARCH_RESULT_COUNT:-3}"
      WEB_LOADER_CONCURRENT_REQUESTS: "${WEB_LOADER_CONCURRENT_REQUESTS:-5}"
      SEARXNG_QUERY_URL: "${SEARXNG_QUERY_URL:-http://searxng:8080/search?q=<query>}"
      # Variaveis legadas mantidas para compatibilidade com builds antigos.
      ENABLE_RAG_WEB_SEARCH: "${ENABLE_WEB_SEARCH:-false}"
      RAG_WEB_SEARCH_ENGINE: "${WEB_SEARCH_ENGINE:-searxng}"
      RAG_WEB_SEARCH_RESULT_COUNT: "${WEB_SEARCH_RESULT_COUNT:-3}"
      RAG_WEB_SEARCH_CONCURRENT_REQUESTS: "${WEB_LOADER_CONCURRENT_REQUESTS:-5}"
    volumes:
      - *ca-volume
      - open-webui-data:/app/backend/data

  reverse-proxy:
    image: caddy:2-alpine
    container_name: ai-reverse-proxy
    restart: unless-stopped
    depends_on:
      - open-webui
    environment:
      AI_HOSTNAME: "${AI_HOSTNAME:-ai.localhost}"
      AI_HTTPS_PORT: "${AI_HTTPS_PORT:-443}"
    ports:
      - "${AI_BIND_HOST:-127.0.0.1}:${AI_HTTP_PORT:-80}:80"
      - "${AI_BIND_HOST:-127.0.0.1}:${AI_HTTPS_PORT:-443}:443"
    entrypoint:
      - /bin/sh
      - /etc/caddy/start-proxy.sh
    volumes:
      - ./proxy/Caddyfile.https:/etc/caddy/Caddyfile.https:ro
      - ./proxy/start-proxy.sh:/etc/caddy/start-proxy.sh:ro
      - ./certs:/certs:ro

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: ai-searxng
    restart: unless-stopped
    profiles:
      - web-search
    ports:
      - "${SEARXNG_BIND_HOST:-127.0.0.1}:${SEARXNG_PORT:-8080}:8080"
    environment:
      <<: *ca-env
      SEARXNG_BASE_URL: "http://${SEARXNG_BIND_HOST:-127.0.0.1}:${SEARXNG_PORT:-8080}/"
    volumes:
      - *ca-volume
      - ./searxng:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng:rw
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  ollama-models:
  open-webui-data:
  searxng-cache:
